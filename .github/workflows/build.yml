name: Build PS4 PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download PKG Tools & Extract
        run: |
          curl -L -o pkg_tools.zip "https://github.com/Bucanero/pkgi-ps4/releases/download/v1.0.0/pkg_tools.zip"
          Expand-Archive -Path pkg_tools.zip -DestinationPath C:\pkg_tools
          tar -xzf PS4_Dummy_App_Project.tar.gz

      - name: Build Fake PKG directly
        run: |
          $eboot = Get-ChildItem -Recurse -Filter "eboot.bin" | Select-Object -First 1
          $appDir = $eboot.Directory.FullName
          
          # إجبار الأداة على إنشاء مشروع مصغر مطابق لمواصفات PS4
          C:\pkg_tools\orbis-pub-cmd.exe img_create --passcode "00000000000000000000000000000000" "$appDir" MyTestApp.pkg

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-PKG-File
          path: MyTestApp.pkg
