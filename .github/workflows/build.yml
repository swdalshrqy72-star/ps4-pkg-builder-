name: Build PS4 PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gengp4 & Download Tools
        run: |
          pip install gengp4
          curl -L -o pkg_tools.zip "https://github.com/Bucanero/pkgi-ps4/releases/download/v1.0.0/pkg_tools.zip"
          Expand-Archive -Path pkg_tools.zip -DestinationPath C:\pkg_tools

      - name: Extract Project and Create GP4
        run: |
          tar -xzf PS4_Dummy_App_Project.tar.gz
          $eboot = Get-ChildItem -Recurse -Filter "eboot.bin" | Select-Object -First 1
          $appDir = $eboot.Directory.FullName
          gengp4 "$appDir" --output project.gp4

      - name: Build PKG File
        run: |
          C:\pkg_tools\orbis-pub-cmd.exe img_create project.gp4 MyTestApp.pkg

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-PKG-File
          path: MyTestApp.pkg
