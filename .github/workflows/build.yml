name: Build PS4 PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Tools and Extract
        run: |
          curl -L -o pkg_tools.zip "https://github.com/Bucanero/pkgi-ps4/releases/download/v1.0.0/pkg_tools.zip"
          Expand-Archive -Path pkg_tools.zip -DestinationPath C:\pkg_tools
          tar -xzf PS4_Dummy_App_Project.tar.gz

      - name: Create GP4 File
        run: |
          $eboot = Get-ChildItem -Recurse -Filter "eboot.bin" | Select-Object -First 1
          $appDir = $eboot.Directory.FullName
          
          python -c "
          import os
          app = r'$appDir'.replace('\\\\', '/')
          xml = f'''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <ps4_project version=\"1.00\">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2023-01-01 00:00:00</volume_ts>
              <package format=\"pkg\" AutomaticVolumeSet=\"false\"/>
            </volume>
            <files dir_path=\"{app}\">
              <file orig_path=\"eboot.bin\" dst_path=\"eboot.bin\"/>
              <file orig_path=\"param.sfo\" dst_path=\"param.sfo\"/>
            </files>
          </ps4_project>'''
          with open('project.gp4', 'w', encoding='utf-8') as f: f.write(xml)
          "

      - name: Build PKG
        run: |
          C:\pkg_tools\orbis-pub-cmd.exe img_create project.gp4 MyTestApp.pkg

      - name: Upload PKG Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS4-PKG-File
          path: MyTestApp.pkg
